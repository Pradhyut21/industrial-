name: 🐛 Bug Report
description: Create a report to help us improve DeadMind
title: "[BUG] <concise description>"
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue with DeadMind! Please provide as much context as possible.
  - type: textarea
    id: bug-description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component Affected
      options:
        - "CFO Plant Knowledge Map (/)"
        - "Field Technician Copilot (/copilot)"
        - "Plant Head SOP Audit (/audit)"
        - "Continuity Vault (/vault)"
        - "Task Explainer / Recovery Run 3D (/game)"
        - "Voice / WhatsApp Webhooks"
        - "RAG Hybrid Retrieval Pipeline"
        - "Backend Core / Ingestion"
    validations:
      required: true
  - type: textarea
    id: reproduction-steps
    attributes:
      label: Steps to Reproduce
      description: Exact steps to reproduce the behavior.
      placeholder: |
        1. Start server with `python run.py`
        2. Navigate to `http://localhost:8000/vault`
        3. Query ...
    validations:
      required: true
  - type: textarea
    id: expected-vs-actual
    attributes:
      label: Expected vs Actual Behavior
      description: What did you expect to happen vs what actually happened?
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment Info
      description: OS version, Python version, Node version, GPU/CPU.
      value: |
        - OS: Windows / Linux / macOS
        - Python Version: 3.11+
        - Node Version: 20+
        - Browser: Chrome / Edge / Safari
